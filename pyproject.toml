[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "build", "dist", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "PLW", "RET"]
ignore = [
    "E501",   # длина строк
    "E402",   # импорты не в начале файла
    "B008",   # вызов функции в аргументе по умолчанию (норма для Tkinter)
    "RUF013", # неявный Optional — фикс может сломать поведение
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"setup.py" = ["E402"]
